<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LinkBio - Your All-in-One Link Page</title>
    <meta name="description" content="Connect with me through all my links" />
    <meta
      name="keywords"
      content="linktree, link in bio, social links, portfolio"
    />
    <meta property="og:title" content="LinkBio - My Links" />
    <meta
      property="og:description"
      content="Connect with me through all my links"
    />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="background-effects">
      <div class="gradient-orb orb-1"></div>
      <div class="gradient-orb orb-2"></div>
      <div class="gradient-orb orb-3"></div>
    </div>

    <div class="container">
      <!-- Header Section -->
      <header class="profile-header">
        <div class="profile-image-wrapper">
          <img
            src="assets/logo instagram.png"
            alt="Profile"
            class="profile-image"
            id="profileImage"
          />
          <div class="profile-ring"></div>
        </div>
        <h1 class="profile-name" id="profileName">LUCKY PRODUCTION</h1>
        <p class="profile-username" id="profileUsername">@luckyproduction</p>
        <p class="profile-bio" id="profileBio">Welcome to my link page!</p>

        <!-- Social Media Icons -->
        <div class="social-icons" id="socialIcons">
          <a
            href="#"
            class="social-icon"
            data-platform="instagram"
            title="Instagram"
          >
            <i class="fab fa-instagram"></i>
          </a>
          <a
            href="#"
            class="social-icon"
            data-platform="twitter"
            title="Twitter"
          >
            <i class="fab fa-twitter"></i>
          </a>
          <a
            href="#"
            class="social-icon"
            data-platform="youtube"
            title="YouTube"
          >
            <i class="fab fa-youtube"></i>
          </a>
          <a href="#" class="social-icon" data-platform="tiktok" title="TikTok">
            <i class="fab fa-tiktok"></i>
          </a>
          <a
            href="#"
            class="social-icon"
            data-platform="linkedin"
            title="LinkedIn"
          >
            <i class="fab fa-linkedin-in"></i>
          </a>
        </div>
      </header>

      <!-- Links Section -->
      <main class="links-container" id="linksContainer">
        <!-- Links will be dynamically inserted here -->
      </main>

      <!-- Footer -->
      <footer class="footer">
        <button class="share-btn" id="shareBtn" title="Share Profile">
          <i class="fas fa-share-alt"></i>
          <span>Share</span>
        </button>
        <button class="admin-btn" id="adminBtn" title="Admin Panel">
          <i class="fas fa-cog"></i>
        </button>
        <div class="qr-btn" id="qrBtn" title="QR Code">
          <i class="fas fa-qrcode"></i>
        </div>
      </footer>

      <!-- Theme Toggle -->
      <button class="theme-toggle" id="themeToggle" title="Toggle Theme">
        <i class="fas fa-moon"></i>
      </button>
    </div>

    <!-- QR Code Modal -->
    <div class="modal" id="qrModal">
      <div class="modal-content">
        <span class="modal-close" id="qrModalClose">&times;</span>
        <h2>Scan QR Code</h2>
        <div class="qr-container" id="qrContainer"></div>
        <p class="qr-text">Scan to visit my profile</p>
      </div>
    </div>

    <!-- Share Modal -->
    <div class="modal" id="shareModal">
      <div class="modal-content">
        <span class="modal-close" id="shareModalClose">&times;</span>
        <h2>Share Profile</h2>
        <div class="share-options">
          <button class="share-option" data-share="copy">
            <i class="fas fa-link"></i>
            <span>Copy Link</span>
          </button>
          <button class="share-option" data-share="whatsapp">
            <i class="fab fa-whatsapp"></i>
            <span>WhatsApp</span>
          </button>
          <button class="share-option" data-share="twitter">
            <i class="fab fa-twitter"></i>
            <span>Twitter</span>
          </button>
          <button class="share-option" data-share="facebook">
            <i class="fab fa-facebook"></i>
            <span>Facebook</span>
          </button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
